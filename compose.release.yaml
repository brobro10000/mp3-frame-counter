# Run the exact loaded release images with the matching source's runtime settings.
# Set both immutable image IDs from manifest.json; startup never pulls or builds images.
# Usage: docker compose -f compose.yaml -f compose.release.yaml up --no-build --pull never --detach --wait
services:
  api:
    image: "${API_IMAGE:?Set API_IMAGE to the API localImageId in the release manifest}"
    platform: linux/amd64
    pull_policy: never
  frontend:
    image: "${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the frontend localImageId in the release manifest}"
    platform: linux/amd64
    pull_policy: never
