        id: acceptance-preflight
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_REVIEW_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
          ENV: ""
        run: |
          # Validate the event and extract trusted code before any head-owned installation or command.
          node --input-type=module <<'NODE'
