name: MVP CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: mvp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate-foundation:
    name: Linter
    uses: ./.github/workflows/linter.yml
    permissions:
      contents: read
      pull-requests: read
  validate-product:
    name: Base acceptance E2E
    uses: ./.github/workflows/base-acceptance-e2e.yml
    permissions:
      contents: read
      pull-requests: read
  control-plane:
    name: control-plane
    if: ${{ always() }}
    needs:
      - validate-foundation
      - validate-product
      - application-tests
      - server-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require every mandatory result to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
  deliver-foundation:
    name: deliver-foundation
    needs:
      - control-plane
      - validate-product
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-product.outputs.release-ready
      != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run artifact:foundation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundation-${{ github.sha }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish-release:
    name: publish-release
    needs:
      - control-plane
      - validate-product
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-product.outputs.release-ready
      == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-release-main
      cancel-in-progress: false
    env:
      CI_BASE_REF: ${{ github.event.before }}
      GATE_ADMISSION_SHA256: ${{ needs.validate-product.outputs.acceptance-admission-sha256 }}
    outputs:
      handoff-ready: ${{ steps.publisher-handoff-receipt.outputs.handoff-ready }}
      handoff-artifact-id: ${{ steps.publisher-handoff-receipt.outputs.handoff-artifact-id }}
      handoff-artifact-sha256: ${{ steps.publisher-handoff-receipt.outputs.handoff-artifact-sha256 }}
      handoff-sha256: ${{ steps.publisher-handoff-receipt.outputs.handoff-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.validate-product.outputs.release-artifact }}
          path: .artifacts/release-input
      - name: Publish verified private release without deployment
        id: publish-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
      - name: Upload verified publisher handoff
        id: upload-publisher-handoff
        if: ${{ steps.publish-release.outputs.handoff-ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.publish-release.outputs.handoff-artifact-name }}
          path: .artifacts/publisher-handoff/handoff.json
          archive: true
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          retention-days: 90
          include-hidden-files: true
      - name: Record verified publisher handoff receipt
        id: publisher-handoff-receipt
        env:
          HANDOFF_ARTIFACT_ID: ${{ steps.upload-publisher-handoff.outputs.artifact-id }}
          HANDOFF_ARTIFACT_SHA256: ${{ steps.upload-publisher-handoff.outputs.artifact-digest }}
          HANDOFF_SHA256: ${{ steps.publish-release.outputs.handoff-sha256 }}
        run: node scripts/publisher-handoff.mjs
  deploy-stage:
    name: deploy-stage
    needs:
      - publish-release
      - validate-product
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGE_DELIVERY_ENABLED == 'true' &&
      vars.STAGE_DEPLOYMENT_CONFIG != '' && needs.validate-product.outputs.release-ready == 'true' &&
      needs.publish-release.outputs.handoff-ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    env:
      CI_BASE_REF: ${{ github.event.before }}
      GATE_ADMISSION_SHA256: ${{ needs.validate-product.outputs.acceptance-admission-sha256 }}
      STAGE_DEPLOYMENT_CONFIG: ${{ secrets.STAGE_DEPLOYMENT_CONFIG }}
      GIT_OPTIONAL_LOCKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.validate-product.outputs.release-artifact }}
          path: .artifacts/release-input
      - id: verify-stage
        run: node scripts/stage-delivery.mjs verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: registry-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ steps.verify-stage.outputs.project-id }}
          workload_identity_provider: ${{ steps.verify-stage.outputs.wif-provider }}
          service_account: ${{ steps.verify-stage.outputs.registry-writer }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - run: node scripts/stage-delivery.mjs push
        env:
          REGISTRY_ACCESS_TOKEN: ${{ steps.registry-auth.outputs.access_token }}
      - id: stage-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ steps.verify-stage.outputs.project-id }}
          workload_identity_provider: ${{ steps.verify-stage.outputs.wif-provider }}
          service_account: ${{ steps.verify-stage.outputs.stage-deployer }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - run: node scripts/stage-delivery.mjs deploy
        env:
          STAGE_ACCESS_TOKEN: ${{ steps.stage-auth.outputs.access_token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: stage-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/stage
          if-no-files-found: ignore
          retention-days: 30
  application-tests:
    name: Application tests
    uses: ./.github/workflows/application-tests.yml
    permissions:
      contents: read
      pull-requests: read
  server-tests:
    name: Server tests
    uses: ./.github/workflows/server-tests.yml
    permissions:
      contents: read
      pull-requests: read
