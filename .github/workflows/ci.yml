              assert.equal(event.number, Number(match[1]));
              assert.equal(event.pull_request?.base?.sha, base);
              assert.equal(event.pull_request?.base?.ref, "main");
              assert.deepEqual(git("rev-list", "--parents", "-n", "1", source).split(" "),
                [source, base, event.pull_request?.head?.sha]);
            }
            const outside = (path) => {
              const relation = relative(root, realpathSync(path));
              assert(relation === ".." || relation.startsWith("../"), "Trusted files must stay outside the checkout");
            };
            outside(env.RUNNER_TEMP);
            outside(dirname(env.GITHUB_OUTPUT));
            const trusted = mkdtempSync(join(realpathSync(env.RUNNER_TEMP), "mp3-admission-"));
            mkdirSync(join(trusted, "scripts"), { mode: 0o700 });
            const registryPath = "docs/testing/acceptance-transitions.json";
            const introduced = git("log", "--first-parent", "--format=%H", base, "--", registryPath) !== "";
            const extract = (name) => {
              const path = `scripts/${name}`;
              const entry = git("ls-tree", base, "--", path);
              assert(/^(100644|100755) blob [a-f0-9]{40}\t/.test(entry), "Missing regular trusted module");
              const bytes = execFileSync("git", ["--no-replace-objects", "show", `${base}:${path}`], {
                cwd: root, maxBuffer: 1024 * 1024, stdio: ["ignore", "pipe", "pipe"],
