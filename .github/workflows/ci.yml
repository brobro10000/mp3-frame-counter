      - run: npm ci
      - run: node scripts/run-ci-phase.mjs
        env:
          GATE_ADMISSION_PATH: ${{ steps.acceptance-preflight.outputs.admission-path }}
          GATE_ADMISSION_SHA256: ${{ steps.acceptance-preflight.outputs.admission-sha256 }}
      # Export on this runner, where acceptance's exact image IDs still exist. Pull requests never run publication.
      - id: release-bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/publish-release-bundle.mjs
        env:
          GATE_ADMISSION_PATH: ${{ steps.acceptance-preflight.outputs.admission-path }}
          GATE_ADMISSION_SHA256: ${{ steps.acceptance-preflight.outputs.admission-sha256 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.release-bundle.outputs.ready == 'true' }}
        with:
          name: ${{ steps.release-bundle.outputs.artifact-name }}
          path: ${{ steps.release-bundle.outputs.directory }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  control-plane:
    name: control-plane
    if: ${{ always() }}
    needs: [validate-foundation, validate-product]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require every mandatory result to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs

  deliver-foundation:
    name: deliver-foundation
    needs: [control-plane, validate-product]
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-product.outputs.release-ready
      != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run artifact:foundation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-${{ github.sha }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Release artifacts only: no registry push, provider credential, service deployment or production approval flow.
  publish-release:
    name: publish-release
    needs: [control-plane, validate-product]
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-product.outputs.release-ready
      == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-release-main
      cancel-in-progress: false
    env:
      CI_BASE_REF: ${{ github.event.before }}
      GATE_ADMISSION_SHA256: ${{ needs.validate-product.outputs.acceptance-admission-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-product.outputs.release-artifact }}
          path: .artifacts/release-input
      - name: Publish verified private release without deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
