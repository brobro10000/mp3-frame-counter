name: MVP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-foundation:
    name: validate-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      # Validate the bootstrap schema without cloud credentials, backend access, planning or resource changes.
      - name: Validate cloud bootstrap without credentials
        run: |
          terraform -chdir=infra/cloud/bootstrap fmt -check
          terraform -chdir=infra/cloud/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/cloud/bootstrap validate -no-color
      - run: npm run mermaid:install
      # Match upstream Mermaid CLI CI: Ubuntu's Chrome AppArmor profile permits Chrome's own sandbox to operate.
      - run: aa-exec --profile=chrome npm run validate

  # This job always runs. Its trusted-base/content checks choose mandatory work without a PR phase selector.
  validate-product:
    name: validate-product
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    outputs:
      release-ready: ${{ steps.release-bundle.outputs.ready }}
      release-artifact: ${{ steps.release-bundle.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/run-ci-phase.mjs
      # Export on this runner, where acceptance's exact image IDs still exist. Pull requests never run publication.
      - id: release-bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/publish-release-bundle.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.release-bundle.outputs.ready == 'true' }}
        with:
          name: ${{ steps.release-bundle.outputs.artifact-name }}
          path: ${{ steps.release-bundle.outputs.directory }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  control-plane:
    name: control-plane
    if: ${{ always() }}
    needs: [validate-foundation, validate-product]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require every mandatory result to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs

  deliver-foundation:
    name: deliver-foundation
    needs: [control-plane, validate-product]
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-product.outputs.release-ready
      != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run artifact:foundation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-${{ github.sha }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Release artifacts only: no registry push, provider credential, service deployment or production approval flow.
  publish-release:
    name: publish-release
    needs: [control-plane, validate-product]
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate-product.outputs.release-ready
      == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-release-main
      cancel-in-progress: false
    env:
      CI_BASE_REF: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-product.outputs.release-artifact }}
          path: .artifacts/release-input
      - name: Publish verified private release without deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
