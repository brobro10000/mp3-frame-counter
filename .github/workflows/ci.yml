            const base = env.CI_BASE_REF;
            for (const value of [source, base]) assert(/^[a-f0-9]{40}$/.test(value ?? "") && !/^0+$/.test(value));
            assert.notEqual(source, base);
            assert.equal(env.CI, "true");
            assert.equal(env.GITHUB_ACTIONS, "true");
            assert.equal(env.GITHUB_SERVER_URL, "https://github.com");
            assert.equal(env.GITHUB_API_URL, "https://api.github.com");
            assert.equal(env.GITHUB_WORKFLOW_SHA, source);
